name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # 每周一 08:00 UTC 定期扫描

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Autobuild ran `./gradlew assemble`, which also packages the release variant and
          # fails without the signing keystore. CodeQL only needs the debug sources compiled.
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # A fresh, traced compile: no Gradle daemon, no build cache, Kotlin compiled in the traced
      # process, so the extractor sees every Kotlin and Java source.
      - name: Compile debug sources
        if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew --no-daemon --no-build-cache
          -Pkotlin.compiler.execution.strategy=in-process
          :app:compileDebugSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
