name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt
      - name: Install declared server and test dependencies
        run: python -m pip install -r server/requirements-test.txt
      - name: Run isolated server tests (external network blocked)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -p no:cacheprovider server

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Android Lint (baseline ratchet — only new issues fail)
        run: ./gradlew :app:lintDebug

      - name: detekt (Kotlin static analysis — baseline ratchet, only new issues fail)
        run: ./gradlew :app:detekt

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
