<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo 调试控制台</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="debug-style.css">
</head>
<body>

<h1>调试控制台</h1>
<p class="subtitle">远程测试工具能力</p>
<nav class="page-nav" aria-label="页面导航">
  <a class="page-nav-link" href="console.html">网页遥控台</a>
  <a class="page-nav-link" href="index.html">配置</a>
  <a class="page-nav-link" href="../pc_remote.html">远程桌面</a>
</nav>

<main class="layout">
  <!-- Main Content -->
  <div class="main-content">
    <div class="quick-actions">
      <button class="quick-btn" data-tool="get_screen_info">屏幕信息</button>
      <button class="quick-btn" data-tool="find_node_info">节点树</button>
      <button class="quick-btn" data-tool="take_screenshot">截图</button>
      <button class="quick-btn" data-tool="get_installed_apps">应用列表</button>
    </div>

    <div class="search-box">
      <input class="search-input" id="searchInput" type="text" placeholder="搜索工具..." autocomplete="off">
    </div>

    <div class="tool-groups" id="toolList" aria-label="工具列表" role="list"></div>
    <div class="tool-state" id="toolState" data-state="loading" aria-live="polite">
      <svg class="tool-state-icon tsi-loading" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
      <svg class="tool-state-icon tsi-error" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <svg class="tool-state-icon tsi-empty" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <div class="tool-state-title" id="toolStateTitle">正在加载工具…</div>
      <div class="tool-state-desc" id="toolStateDesc"></div>
      <button class="tool-state-retry" id="toolStateRetry" type="button" hidden>重试</button>
    </div>

    <div class="panel" id="toolPanel" style="display:none">
      <div class="panel-title" id="toolName"></div>
      <div class="panel-desc" id="toolDesc"></div>
      <div id="paramFields"></div>
      <button class="exec-btn" id="execBtn">Execute</button>
    </div>

    <div class="result-panel" id="resultPanel" style="display:none">
      <div class="result-header">
        <span class="result-status" id="resultStatus"></span>
        <span class="result-time" id="resultTime"></span>
      </div>
      <div class="response-time-bar" id="responseTimeBar" style="display:none">
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label"></span>
      </div>
      <pre class="result-body" id="resultBody"></pre>
      <img class="result-image" id="resultImage" />
    </div>
  </div>

  <!-- History Sidebar -->
  <div class="history-sidebar" aria-label="执行历史">
    <div class="history-panel">
      <div class="history-title">
        <span>执行历史</span>
        <button class="history-clear-btn" id="historyClearBtn">清空</button>
      </div>
      <div class="history-empty" id="historyEmpty">暂无执行记录</div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>
</main>

<script src="debug-app.js"></script>
</body>
</html>
