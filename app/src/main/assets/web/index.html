<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Mobile</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <div id="loading" class="loading" data-i18n="loading"></div>

  <div id="content" style="display:none">
    <!-- Cards are rendered by app.js via renderCards() -->
    <div class="card nav-card">
      <div class="card-title">
        <span class="dot"></span>
        <span data-i18n="nav_title">快速入口</span>
      </div>
      <div class="nav-grid">
        <a class="nav-link" href="console.html" data-page="console">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="12" y1="18" x2="12" y2="18"/>
          </svg>
          <span data-i18n="nav_console">网页遥控台</span>
        </a>
        <a class="nav-link" href="debug.html" data-page="debug">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          <span data-i18n="nav_debug">调试控制台</span>
        </a>
        <a class="nav-link" href="../pc_remote.html" data-page="remote">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span data-i18n="nav_remote">远程桌面</span>
        </a>
      </div>
      <p class="card-tip" data-i18n="nav_tip">提示：远程访问需携带 token，URL 形如 .../console.html#token=xxx</p>
    </div>
    <button class="btn" id="saveBtn" data-i18n="save_btn"></button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
