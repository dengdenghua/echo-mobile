<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Echo 远程桌面</title>
<link rel="stylesheet" href="web/tokens.css">
<link rel="stylesheet" href="pc_remote-style.css">
</head>
<body>
  <div id="bar">
    <button type="button" class="bar-btn" id="btn-back" title="返回">‹ 返回</button>
    <button class="bar-btn" id="btn-retry" type="button">重新连接</button>
    <span class="bar-title">电脑远控</span>
    <span class="sp"></span>
    <span id="conn-badge" aria-hidden="true"></span>
    <span id="st" aria-live="polite">○ 连接中</span>
    <span class="bar-group" aria-label="工具">
      <button type="button" class="bar-btn" id="btn-backspace" data-input disabled title="退格" aria-label="退格"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
      <button type="button" class="bar-btn" id="btn-esc" data-input disabled title="Esc">Esc</button>
      <button type="button" class="bar-btn" id="btn-kb" data-input disabled title="键盘" aria-label="切换键盘"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg></button>
      <button type="button" class="bar-btn" id="btn-help" title="帮助" aria-label="帮助">?</button>
    </span>
  </div>
  <div id="wrap"><video id="v" autoplay playsinline muted></video><img id="relay-frame" alt="电脑画面" hidden></div>
  <main class="remote-main">
  <div id="status" aria-live="polite">正在与主机建立 WebRTC 连接…<br>请保持电脑端 Echo 在线，并允许此手机连接。<div id="retry-countdown"></div></div>
  <div id="guide" role="dialog" aria-label="操作帮助" hidden><p>轻点点击，按住显示右键，单指拖动，双指平移滚动，双指张合缩放。打开键盘可输入中文与文字。</p><p>在电脑的设备互联中选择此手机，允许观看或控制。跨网连接失败时，可由电脑端配置连接中继。</p></div>
  <div id="kb">
    <div id="kb-handle"></div>
    <div id="kb-row">
      <input id="kbi" maxlength="4096" placeholder="输入文字到 PC">
      <button type="button" id="btn-send-type" data-input disabled>发送</button>
      <button type="button" id="btn-enter" data-input disabled>回车</button>
    </div>
  </div>
  </main>
<script src="pc_remote-session.js"></script>
<script src="pc_remote-app.js"></script>
</body>
</html>
