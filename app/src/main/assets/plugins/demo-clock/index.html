<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 IP</title>
  <style>
    /* ECHO palette: Graphite by default, Snow when the app is light. Colour only carries state. */
    :root { --ground:#090A0C; --surface:#171A1F; --line:rgba(255,255,255,0.08); --ink:#EEF1F4;
            --muted:#9AA3AE; --action:#EEF1F4; --on-action:#0A0B0D; }
    @media (prefers-color-scheme: light) {
      :root { --ground:#EEF0F3; --surface:#FFFFFF; --line:rgba(10,12,16,0.08); --ink:#111317;
              --muted:#59616C; --action:#111317; --on-action:#FFFFFF; }
    }
    body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--ground);
           color:var(--ink); height:100vh; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:20px; }
    .card { background:var(--surface); border:1px solid var(--line);
            border-radius:10px; padding:28px 36px; text-align:center; }
    h1 { font-size:18px; font-weight:600; margin:0 0 6px; }
    .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
    #ip { font-size:26px; font-weight:600; font-family:ui-monospace,"JetBrains Mono",monospace; }
    #ip.status { font-size:15px; font-weight:400; font-family:inherit; color:var(--muted); }
    #note { margin-top:12px; font-size:13px; color:var(--muted); min-height:16px; }
    button { margin-top:18px; background:var(--action); color:var(--on-action); border:none; border-radius:8px;
             padding:11px 22px; font-size:14px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>示例小程序</h1>
    <div class="sub">这台手机当前的出口 IP</div>
    <div id="ip">…</div>
    <div id="note"></div>
    <button onclick="loadIp(0)">刷新</button>
  </div>
  <script>
    // Show a status line in body text; the large mono style is only for the IP itself.
    function showStatus(el, text) { el.className = 'status'; el.textContent = text; }

    function loadIp(attempt) {
      var el = document.getElementById('ip');
      attempt = attempt || 0;
      showStatus(el, '查询中…');
      try {
        if (!window.octopus) {
          // The bridge arrives when the page has loaded; wait up to about 3 s for it.
          if (attempt < 15) { setTimeout(function () { loadIp(attempt + 1); }, 200); return; }
          showStatus(el, '没有连上 Echo');
          return;
        }
        var r = window.octopus.callTool('get_my_ip', {});
        if (r && r.ok) {
          var ip = r.data;
          try { ip = JSON.parse(r.data).ip || r.data; } catch (e) {}
          el.className = '';
          el.textContent = ip;
        } else {
          showStatus(el, '查询失败：' + (r && r.error ? r.error : '未知错误'));
        }
      } catch (e) {
        showStatus(el, '查询失败：' + e.message);
      }
      // mini-app → Agent:上报"刷新"发生了(Agent 可感知)
      if (window.octopus && octopus.reportAction) octopus.reportAction('refreshed', {});
    }

    // Agent → mini-app:处理 app_action 派发来的动作(移植 OpenRoom onAgentAction)
    function registerAgentActions() {
      if (!window.octopus) { setTimeout(registerAgentActions, 200); return; }
      octopus.onAgentAction = function (actionType, params) {
        if (actionType === 'refresh') { loadIp(); return 'refreshing'; }
        if (actionType === 'set_note') {
          document.getElementById('note').textContent = (params && params.text) || '';
          return 'note updated';
        }
        return 'unknown action: ' + actionType;
      };
    }
    registerAgentActions();

    // 等 octopus shim 注入后再调
    setTimeout(loadIp, 300);
  </script>
</body>
</html>
